input_queries: "queries.csv"  # file with a list of queries to use for evaluation

# Evaluation results are written to the "results_folder" folder.
results_folder: "results/"
generated_answers: "chromadb_generated_answers.csv"
eval_results_file: "results.csv"
metrics_file: "metrics.png"

evaluator:
  - type: "TRECEvaluator"
    model:
      type: "OpenAIModel"
      name: "gpt-4o-mini"
      api_key: ${oc.env:OPENAI_API_KEY}  # Reads from environment variable.
    options:
      k_values: [1, 3, 5]
      run_consistency: True
      metrics_to_run_consistency: ["mean_umbrela_score", "vital_nuggetizer_score", "citation_f1_score"]
  - type: "ConsistencyEvaluator"
    options:
      metrics:
        - bert_score: { }
        - rouge_score: { }

connector:
  type: "ChromaDBConnector"
  options:
    # Path to your existing ChromaDB persistent storage directory
    chroma_db_path: "/path/to/your/chroma_db"
    # Name of the existing ChromaDB collection to evaluate
    collection_name: "your_collection_name"
    top_k: 10
    max_workers: -1  # -1 to use all available CPU cores
    repeat_query: 5  # repeat queries for consistency evaluation
    openai_embedding_model: "text-embedding-3-large"
    openai_llm_model: "gpt-4o"

